services:
  commit-lab:
    build: .
    image: commit-lab:latest
    container_name: commit-lab
    ports:
      - "8080:80"
    restart: unless-stopped

  # Development: hot reload with the source mounted from the host.
  commit-lab-dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: commit-lab-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - .:/app
      - commit-lab-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  commit-lab-node-modules:
